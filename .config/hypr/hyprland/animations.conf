animations {
    enabled = true

    # === Curves ===
    bezier = native,    0.15, 1.0,  0.4,  1.0  # weighted decel — moves & workspaces
    bezier = spring,    0.2,  1.15, 0.4,  1.0  # app open
    bezier = springWS,  0.2,  1.25, 0.4,  1.0  # workspace switch
    bezier = springPop, 0.175,1.1,  0.32, 1.0  # popups & layers — tighter spring
    bezier = close,     0.4,  0.0,  0.75, 0.9  # app/layer close
    bezier = fadeFlow,  0.25, 1.0,  0.5,  1.0  # fade — gentle, no overshoot
    bezier = borderPop, 0.2,  1.3,  0.4,  1.0  # border — snappier overshoot

    # === Workspaces ===
    animation = workspaces,       1, 6, springWS,  slidevert
    animation = specialWorkspace, 1, 5, springWS,  slidevert

    # === Windows ===
    animation = windowsIn,   1, 6, spring     # app open — standard spring
    animation = windowsOut,  1, 4, close      # app close — quick shrink
    animation = windowsMove, 1, 6, spring     # reflow after close

    # === Layers (bar, overlay, notification) ===
    animation = layersIn,   1, 5, springPop   # tighter — overlays feel lighter
    animation = layersOut,  1, 3, close       # snappy vanish
    animation = fadeLayers, 1, 4, fadeFlow    # smooth opacity blend

    # === Fade ===
    animation = fade,    1, 5, fadeFlow       # content fade — gentle
    animation = fadeDim, 1, 7, fadeFlow       # dim — slowest, most subtle

    # === Border ===
    animation = border, 1, 5, borderPop       # snappy focus ring
}
