# ~/.config/kitty/kitty.conf
# ==============================================================================
# Olvex Shell — Material 3 Expressive Kitty Theme
# Dynamic tokens read from: ~/.local/state/olvex/scheme.json
#
# Primary Accent  (primary):             #9ED1C0
# On Primary      (onPrimary):           #15483C
# Primary Cont.   (primaryContainer):    #2A5B4E
# On Primary Cont (onPrimaryContainer):  #BAEEDD
# Secondary       (secondary):           #B2CCC2
# Background      (surface/background):  #0A0F0D
# Foreground      (onBackground):        #DDE8E2
# Muted Text      (onSurfaceVariant):    #A3AEA8
# Error           (error):               #FA746F
# ==============================================================================

# ── Font Configuration ────────────────────────────────────────────────────────
# Font choice justification: JetBrainsMono Nerd Font provides a clean geometric
# monospace aesthetic matching Olvex's M3 proportions and full icon support.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures never

# ── Window & Layout ───────────────────────────────────────────────────────────
# Olvex uses Hyprland tiling — borderless windows integrate cleanly with gaps
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0

# ── Cursor & Animation ────────────────────────────────────────────────────────
cursor_shape beam
cursor_blink_interval 0

# Native Cursor Trail Animation (Requires kitty >= 0.36.0; installed: 0.48.1)
# Subtle decay parameters allow cursor to glide smoothly between positions
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ── Color Palette ─────────────────────────────────────────────────────────────
background #0a0f0d
background_opacity 0.85
foreground #dde8e2

cursor #9ed1c0
cursor_text_color #15483c

selection_background #2a5b4e
selection_foreground #baeedd

# ── 16-Color ANSI Palette ─────────────────────────────────────────────────────
# Black & Dark Muted (surfaceContainerLow / outlineVariant)
color0 #0e1512
color8 #404a46

# Red / Error (error / onErrorContainer)
color1 #fa746f
color9 #ff9993

# Green / Secondary Accent (secondary / onSecondaryContainer)
color2 #b2ccc2
color10 #aac5bb

# Yellow / Tertiary Accent (tertiary / tertiaryContainer)
color3 #e0f8ff
color11 #b8eefe

# Blue / Primary Accent (primary / onPrimaryContainer)
color4 #9ed1c0
color12 #baeedd

# Magenta (primaryContainer / secondaryContainer)
color5 #2a5b4e
color13 #284039

# Cyan (surfaceTint / tertiary)
color6 #9ed1c0
color14 #e0f8ff

# White & Light Text (onSurfaceVariant / onSurface)
color7 #a3aea8
color15 #dde8e2

# ── Tab Bar Styling ───────────────────────────────────────────────────────────
tab_bar_style separator
tab_separator "  "
tab_bar_min_tabs 2
active_tab_foreground   #15483c
active_tab_background   #9ed1c0
inactive_tab_foreground #a3aea8
inactive_tab_background #141b19
