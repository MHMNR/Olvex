# ~/.config/foot/foot.ini
# ==============================================================================
# Olvex Shell — Material 3 Expressive Foot Terminal Configuration
# Dynamic tokens read from: ~/.local/state/olvex/scheme.json
#
# Primary Accent  (primary):             #9ED1C0
# On Primary      (onPrimary):           #15483C
# Primary Cont.   (primaryContainer):    #2A5B4E
# On Primary Cont (onPrimaryContainer):  #BAEEDD
# Secondary       (secondary):           #B2CCC2
# Background      (surface/background):  #0A0F0D
# Foreground      (onBackground):        #DDE8E2
# Muted Text      (onSurfaceVariant):    #A3AEA8
# Error           (error):               #FA746F
# ==============================================================================

# ── Font & Geometry ───────────────────────────────────────────────────────────
# Font choice justification: JetBrainsMono Nerd Font matches kitty's geometric monospace aesthetic
font=JetBrainsMono Nerd Font:size=11
pad=12x12

# ── Cursor Configuration ──────────────────────────────────────────────────────
# Note on Cursor Animation: foot 1.27.0 is a minimalist Wayland terminal and
# does not support native cursor trail/movement animations like kitty's
# cursor_trail option. Options below tune cursor style and blink behavior.
[cursor]
style=beam
beam-thickness=2.0
blink=no

# ── Color Palette ─────────────────────────────────────────────────────────────
[colors]
alpha=0.85
blur=yes

[colors-dark]
background=0a0f0d
foreground=dde8e2
cursor=15483c 9ed1c0

selection-background=2a5b4e
selection-foreground=baeedd

# Regular 8-Color ANSI
regular0=0e1512
regular1=fa746f
regular2=b2ccc2
regular3=e0f8ff
regular4=9ed1c0
regular5=2a5b4e
regular6=9ed1c0
regular7=a3aea8

# Bright 8-Color ANSI
bright0=404a46
bright1=ff9993
bright2=aac5bb
bright3=b8eefe
bright4=baeedd
bright5=284039
bright6=e0f8ff
bright7=dde8e2
